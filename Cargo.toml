[package]
name = "kennel"
version = "0.2.0"
edition = "2021"
description = "Kennel: run Claude Code and OpenCode agents side by side in real terminals"

[dependencies]
alacritty_terminal = "0.25"
# glow (OpenGL) renderer instead of wgpu, no accesskit: keeps RSS and binary small
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via egui-winit: clipboard images / copied files -> pasted paths.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Dev/test builds: our code builds incrementally in seconds, while dependencies
# (egui, alacritty) are optimized once and cached so terminals render fast.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Thin LTO: nearly the same speed/size as fat LTO, several times faster to build.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
