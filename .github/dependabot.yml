version: 2
updates:
  # Minor/patch crate updates in one weekly PR; CI must pass before merging.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
